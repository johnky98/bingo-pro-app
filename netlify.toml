# Sitio estático sin compilación. El único paso de "build" quita docs/ (documentación interna) y
# pruebas/ (pruebas automáticas del motor) de la copia que se publica: así no se sirven con ninguna
# variante de la URL (mayúsculas, barras codificadas).
[build]
  publish = "."
  command = "rm -rf docs pruebas"
